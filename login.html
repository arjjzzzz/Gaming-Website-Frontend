<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIMURU LOGIN</title>
    <link rel="stylesheet" href="content.css">
    <link rel="stylesheet" href="foot.css">
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/png" href="logo/logo.png">
  </head>
<body style="background-image:url(photos/league-of-legends-4096x2305-11617.png)";>

  <div class="wrapper">
    <header>
      <img src="logo/logo nav.png" alt="" height="110px" width="300px">
      <a href="#" class="logo"></a>
      <ul class="nav">
      <li><a href="Main.html">HOME</a></li>
      <li><a href="Main.html#catagory">CATAGORIES</a></li>
      <li><a href="Main.html#about">ABOUT</a></li>
      <li><a href="#contact">CONTACT US</a></li>
      </ul>
  <div class="search">
    <a class="logbut" id="logbt" href="login.html#login">LOGIN</a>
</div>
</header>
    
<div class="form-box">

  <div class="login-container" id="login">
    <div class="top">
      <span>Don't Have An Account?<a href="#" onclick="register()">Sign Up</a></span>
      <h2>LOGIN</h2>
    </div>
   
    <div class="input-box">
      <input type="text" class="input-field" placeholder="Username or Email">
      <i class="fa-solid fa-user"></i>
    </div>
    <div class="input-box">
      <input type="password" class="input-field" placeholder="Password">
      <i class="fa-solid fa-lock"></i>
    </div>
      <div class="input-box">
        <input type="submit" class="submit" value="Sign In">
      </div>
      <div class="two-col">
        <div class="one">
          <input type="checkbox" id="login-check">
          <label for="login-check">Remember Me</label>
        </div>
        <div class="two">
          <label><a href="#">Forgot password ?</a></label>
        </div>
    </div>
    </div>

  <div class="register-container" id="register">
    <div class="top">
      <span>Have An Account?<a href="#" onclick="login()">Login</a></span>
      <h2>SIGN UP</h2>
    </div>
    <div class="two-forms">
      <div class="input-box">
        <input type="text" class="input-field" placeholder="First Name">
        <i class="fa-solid fa-user"></i>
      </div>
      <div class="input-box">
        <input type="text" class="input-field" placeholder="Last Name">
        <i class="fa-solid fa-user"></i>
      </div>
    </div>
    <div class="input-box">
      <input type="text" class="input-field" placeholder="Email">
      <i class="fa-regular fa-envelope"></i>
    </div>
    <div class="input-box">
      <input type="password" class="input-field" placeholder="Password">
      <i class="fa-solid fa-lock"></i>
    </div>
      <div class="input-box">
        <input type="submit" class="submit" value="Register">
      </div>
      <div class="two-col">
        <div class="one">
          <input type="checkbox" id="register-check">
          <label for="register-check">Remember Me</label>
        </div>
        <div class="two">
          <label><a href="#">Terms & condition</a></label>
        </div>
    </div>
    </div>
  </div>
  </div>



  <footer>
    <div class="footer-col" id="follow">
      <h4>Navigation</h4>
        <ul>
          <li><a href="Main.html">Home</a></li>
          <li><a href="Main.html">About us</a></li>
          <li><a href="Main.html">Menu</a></li>
          <li><a href="Main.html">Gallery</a></li>
        </ul>
    </div>
    <div class="footer-col" id="contact">
      <h4>Contact Us</h4>
        <ul>
          <li><a href="#"><i class="fa-solid fa-envelope"></i>  Mail:abc@gmail.com</a></li>
          <li><a href="#"><i class="fa-solid fa-phone"></i>  PH:123456789</a></li>
        </ul>
    </div>
    <div class="footer-col">
      <h4>Follow Us</h4>
        <div class="media-links">
          <a href="#"><i class="fa-brands fa-facebook"></i></a>
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
          <a href="#"><i class="fa-brands fa-youtube"></i></a>
          <a href="#"><i class="fa-brands fa-twitter"></i></a>
        </div>
    </div>
</footer>


<script>
  var a= document.getElementById("logbt");
  var x= document.getElementById("login");
  var y= document.getElementById("register");

   function login(){
    x.style.left= "4px";
    y.style.right= "-520px";
    a.className = "logbut";
    x.style.opacity=1;
    y.style.opacity= 0;
   }
   function register(){
    x.style.left= "-520px";
    y.style.right= "5px";
    a.className = "logbut";
    x.style.opacity= 0;
    y.style.opacity= 1;
   }
</script>
</body>

</html>
